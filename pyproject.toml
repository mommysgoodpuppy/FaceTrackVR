[project]
name = "FaceTrackVR"
version = "0.3"
description = "Integrated eye and face tracking for VRChat"
authors = [{ name = "mommysgoodpuppy" }]
license = "LicenseRef-Babble-Software-Distribution-License-1.0"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "python-osc>=1.8,<2",
  "requests>=2.28.1,<3",
  "opencv-python>=4.6.0.66,<5",
  "numpy>=1.26.4,<2",
  "pye3d>=0.3.2,<0.4",
  "sv-ttk>=2.6.1,<3",
  "pydantic>=2.4.2,<3",
  "scikit-image",
  "scikit-learn>=1.3",
  "pyserial>=3.5,<4",
  "winotify>=1.1,<2; sys_platform == 'win32'",
  "pywinstyles>=1.8,<2; sys_platform == 'win32'",
  "pygrabber>=0.2,<0.3; sys_platform == 'win32'",
  "colorama>=0.4.6,<0.5",
  "taskipy>=1.10.4,<2",
  "matplotlib>=3.10.7,<4",
  "numba>=0.63.1,<0.68",
  "onnxruntime>=1.20,<2",
  "tomli>=2,<3; python_version < '3.11'",
]

[dependency-groups]
dev = [
  "black>=22.10,<23",
  "flake8>=5.0.4,<6",
  "openvr>=2.5.101,<3",
  "pyinstaller>=6.17,<7",
  "pytest>=8,<9",
  "pytest-cov>=4.1,<5",
]

[tool.uv]
package = false

[tool.poetry]
name = "FaceTrackVR"
version = "0.3"
description = "Integrated eye and face tracking for VRChat"
authors = ["mommysgoodpuppy"]
license = "LICENSE: Babble Software Distribution License 1.0"
repository = "https://github.com/mommysgoodpuppy/FaceTrackVR"

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
python-osc = "^1.8.0"
requests = "^2.28.1"
opencv-python = "^4.6.0.66"
numpy = "~1.26.4"
pye3d = "^0.3.2"
sv-ttk = "^2.6.1"
pydantic = "^2.4.2"
scikit-image = "*"
scikit-learn = ">=1.3"
pyserial = "^3.5"
winotify = [
    { version = "^1.1.0", platform = 'win32' }
]
pywinstyles = {version = "^1.8.0", platform = "win32"}
# DirectShow camera enumeration on Windows. cv2's DSHOW backend opens cameras
# in DirectShow moniker order; pygrabber walks the same enumerator, so its
# name order matches cv2 index order exactly, which Win32_PnPEntity does NOT.
pygrabber = {version = "^0.2", platform = "win32"}
colorama = "^0.4.6"
taskipy = "^1.10.4"
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
matplotlib = "^3.10.7"
numba = ">=0.63.1,<0.68"
tomli = {version = "^2.0", python = "<3.11"}

onnxruntime = "^1.20.0"

[tool.poetry.group.dev.dependencies]
black = "^22.10.0"
pyinstaller = "^6.17.0"
flake8 = "^5.0.4"
openvr = [
    { version = "^2.5.101", platform = 'win32' },
    { version = "^2.5.101", platform = 'linux' }
]

[tool.taskipy.tasks]
dev = "python eyetrackapp.py"

[tool.black]
line-length = 120

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-ra -q"
pythonpath = "."
python_files = [
    "test_*.py"
]
